name: Set up and build plugin
description: Builds the plugin for specified architecture and build config
inputs:
  target:
    description: Target architecture for dependencies
    required: true
  config:
    description: Build configuration
    required: false
    default: RelWithDebInfo
  codesign:
    description: Enable codesigning (macOS only)
    required: false
    default: 'false'
  codesignIdent:
    description: Developer ID for application codesigning (macOS only)
    required: false
    default: '-'
  codesignTeam:
    description: Team ID for application codesigning (macOS only)
    required: false
    default: ''
  workingDirectory:
    description: Working directory for packaging
    required: false
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    - name: Run macOS Build
      if: runner.os == 'macOS'
      shell: zsh --no-rcs --errexit --pipefail {0}
      working-directory: ${{ inputs.workingDirectory }}
      env:
        CCACHE_DIR: ${{ inputs.workingDirectory }}/.ccache
        CODESIGN_IDENT: ${{ inputs.codesignIdent }}
        CODESIGN_TEAM: ${{ inputs.codesignTeam }}
      run: |
        : Run macOS Build

        local -a build_args=(--config ${{ inputs.config }})
        if (( ${+RUNNER_DEBUG} )) build_args+=(--debug)

        if [[ '${{ inputs.codesign }}' == 'true' ]] build_args+=(--codesign)

        # Vertical+: keep a log and surface errors as annotations, since
        # full job logs are not always reachable.
        local -i rc=0
        .github/scripts/build-macos ${build_args} 2>&1 | tee build-macos.log || rc=$?
        if (( rc != 0 )) {
          sed -e 's/\x1b\[[0-9;]*m//g' build-macos.log \
            | grep -E 'error:|Error|FAILED|CMake Error|✖' | grep -v 'Werror' | tail -10 \
            | while IFS= read -r l; do print "::error::${l}"; done
          exit ${rc}
        }

    - name: Install Dependencies 🛍️
      if: runner.os == 'Linux'
      shell: bash
      run: |
        : Install Dependencies 🛍️
        echo ::group::Install Dependencies
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> $GITHUB_PATH
        brew install --quiet zsh
        echo ::endgroup::

    - name: Run Ubuntu Build
      if: runner.os == 'Linux'
      shell: zsh --no-rcs --errexit --pipefail {0}
      working-directory: ${{ inputs.workingDirectory }}
      env:
        CCACHE_DIR: ${{ inputs.workingDirectory }}/.ccache
      run: |
        : Run Ubuntu Build

        local -a build_args=(
          --target ubuntu-${{ inputs.target }}
          --config ${{ inputs.config }}
        )
        if (( ${+RUNNER_DEBUG} )) build_args+=(--debug)

        .github/scripts/build-ubuntu ${build_args}

    - name: Run Windows Build
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Run Windows Build
        if ( $Env:RUNNER_DEBUG -ne $null ) {
          Set-PSDebug -Trace 1
        }

        $BuildArgs = @{
          Target = '${{ inputs.target }}'
          Configuration = '${{ inputs.config }}'
        }

        # Vertical+: keep a log and surface the key facts as annotations,
        # since full job logs are not always reachable.
        $ok = $true
        try {
          .github/scripts/Build-Windows.ps1 @BuildArgs *>&1 | Tee-Object -FilePath build-windows.log
        } catch {
          $ok = $false
          Write-Output "::error::Build failed: $($_.Exception.Message)"
        }
        $log = Get-Content build-windows.log -ErrorAction SilentlyContinue
        $log | Select-String -Pattern 'SHA256 = ' | Select-Object -First 1 | ForEach-Object { Write-Output "::notice::$($_.Line.Trim())" }
        $warnings = @($log | Select-String -Pattern 'warning C\d+' | Where-Object { $_.Line -match 'vertical-plus' })
        Write-Output "::notice::Vertical+ compiler warnings: $($warnings.Count)"
        $warnings | Select-Object -First 8 | ForEach-Object { Write-Output "::warning::$($_.Line.Trim())" }
        $log | Select-String -Pattern 'error C\d+|error LNK\d+|CMake Error' | Select-Object -First 10 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
        if (Test-Path release) {
          Get-ChildItem release -Recurse -File | ForEach-Object {
            Write-Output "::notice::package file $($_.FullName.Substring((Resolve-Path release).Path.Length)) ($($_.Length) bytes)"
          }
        }
        if (-not $ok) { exit 1 }

    - name: Create Summary 📊
      if: contains(fromJSON('["Linux", "macOS"]'),runner.os)
      shell: zsh --no-rcs --errexit --pipefail {0}
      env:
        CCACHE_DIR: ${{ inputs.workingDirectory }}/.ccache
      run: |
        : Create Summary 📊

        local -a ccache_data
        if (( ${+RUNNER_DEBUG} )) {
          setopt XTRACE
          ccache_data=("${(fA)$(ccache -s -vv)}")
        } else {
          ccache_data=("${(fA)$(ccache -s)}")
        }

        print '### ${{ runner.os }} Ccache Stats (${{ inputs.target }})' >> $GITHUB_STEP_SUMMARY
        print '```' >> $GITHUB_STEP_SUMMARY
        for line (${ccache_data}) {
          print ${line} >> $GITHUB_STEP_SUMMARY
        }
        print '```' >> $GITHUB_STEP_SUMMARY
