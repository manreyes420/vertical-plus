PlatformHelp.TikTok="Copy the Server URL and Stream Key from TikTok LIVE Studio or LIVE Producer (only shown to accounts TikTok has enabled for streaming software). TikTok usually gives you a new key each time you go live, so paste the new one before each stream."
PlatformHelp.YouTube="Paste your stream key from YouTube Studio > Create > Go live > Stream. The server is filled in for you. YouTube shows a vertical stream as a Short-style live on mobile."
PlatformHelp.Twitch="Only use this if your main stream goes somewhere else. To show a vertical view on the same Twitch channel as your main stream, use Twitch Dual Format instead: OBS Settings > Stream > Service Twitch > enable Enhanced Broadcasting > Additional Canvas: Vertical+, then start your normal stream. Otherwise paste your stream key from the Twitch Creator Dashboard > Settings > Stream; the server is filled in for you."
PlatformHelp.Kick="Copy the Stream URL and Stream Key from your Kick dashboard (Settings > Stream URL & Key)."
PlatformHelp.Instagram="Copy the Stream URL and Stream Key Instagram shows when you start a live with streaming software (Instagram Live Producer)."
PlatformHelp.Facebook="Paste your stream key from Facebook Live Producer. The server is filled in for you."
PlatformHelp.Custom="Enter the RTMP or RTMPS server URL and stream key from your streaming service or restream tool."

StreamError.Title="Vertical stream"
StreamError.NoServer="The vertical stream has no server URL yet."
StreamError.NoKey="The vertical stream has no stream key yet."
StreamError.ServerFormat="The server URL must start with rtmp:// or rtmps://. Check that the server and the stream key weren't pasted into each other's fields."
StreamError.BadPath="The server URL is not valid. Copy it again from your platform."
StreamError.ConnectFailed="Could not connect to the streaming server. Check the server URL and your internet connection, and that the platform is ready to receive a stream."
StreamError.InvalidStream="The platform rejected the stream key. Copy a fresh key from your platform (TikTok keys change every time you go live)."
StreamError.Disconnected="The vertical stream lost its connection and could not reconnect."
StreamError.Unsupported="The platform does not support these stream settings."
StreamError.EncodeError="The video encoder for the vertical stream failed to start. Try a different encoder in Vertical+ Settings."
StreamError.Unknown="The vertical stream stopped unexpectedly."
StreamError.TwitchTwice="Your main stream is already live on Twitch, and Twitch accepts only one stream per channel, so a second one would knock your main stream off.\n\nTo add a vertical view to the same Twitch channel, use Twitch Dual Format: stop streaming, then in OBS Settings > Stream (service Twitch) enable Enhanced Broadcasting and set Additional Canvas to Vertical+. Start your normal stream; viewers on phones get the vertical view."
